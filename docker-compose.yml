services:
  mongo:
    image: mongo:7
    container_name: tmp_mongo
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/scripts/mongo-entrypoint.sh"]
    ports:
      - "${MONGO_HOST_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo:/scripts:ro

  mongo-express:
    image: mongo-express:1
    container_name: tmp_mongo_express
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_SERVER: mongo
    depends_on:
      - mongo

  mongo-init-replica:
    image: mongo:7
    restart: "no"
    depends_on:
      - mongo
    entrypoint:
      - bash
      - -lc
      - >
        until mongosh "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin?authSource=admin" --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; do
          sleep 2;
        done;
        mongosh "mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin?authSource=admin" --quiet --eval "try { rs.status().ok } catch (err) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) }"

volumes:
  mongo_data:
